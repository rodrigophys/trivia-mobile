<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030703">
<link rel="manifest" href="manifest.webmanifest">
<title>Trivia Trainer</title>
<style>
:root{--bg:#030703;--fg:#aaffaa;--dim:#669966;--line:#173b17;--white:#efffef;--bad:#ff7777}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:16px}
#app{max-width:760px;margin:auto;padding:18px 14px 50px}
h1{font-size:20px;color:var(--white);margin:0 0 4px}
.dim{color:var(--dim)} .small{font-size:13px}.line{border-top:1px solid var(--line);margin:16px 0}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
button{border:1px solid var(--line);background:#061006;color:var(--fg);padding:14px 12px;font:inherit;border-radius:4px;text-align:left}
button:active{background:#0d1d0d}
.q{font-size:19px;line-height:1.48;color:var(--white)} .es{margin-top:14px}
.meta{text-transform:uppercase;color:var(--dim);font-size:13px;margin-bottom:14px}
input{width:100%;background:#010301;border:1px solid var(--line);color:var(--white);padding:15px 12px;font:inherit;font-size:18px;border-radius:4px;outline:none}
input:focus{border-color:#4c994c}
.enter{width:100%;text-align:center;margin-top:8px}
.good{color:#8dff8d;font-size:19px}.bad{color:var(--bad);font-size:19px}.answer{font-size:20px;color:var(--white);margin:7px 0 14px}
.section{margin-top:18px}.section h3{font-size:13px;color:var(--dim);text-transform:uppercase;margin:0 0 8px}
ul{padding-left:20px;margin:7px 0}li{margin:7px 0;line-height:1.35}.info{line-height:1.5;color:var(--white)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.top button{padding:6px 8px}
a{color:var(--fg)}
.factgrid{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px}.factgrid b{color:var(--dim);font-weight:400;text-transform:uppercase}
@media(max-width:480px){#app{padding:14px 12px 36px}.menu{grid-template-columns:1fr}.q{font-size:18px}}
</style>
</head>
<body><div id="app">Loading canon...</div>
<script>
let DATA=null, STATE=null, current=null, currentMode="quick";
const app=document.getElementById("app");

function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function norm(s){return String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim().replace(/\s+/g," ")}
function levenshtein(a,b){if(a===b)return 0;if(Math.abs(a.length-b.length)>2)return 99;let p=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(c[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]}
function acceptSet(...vals){let s=new Set();for(const v of vals){if(!v)continue;for(const part of String(v).split(/[|;/]/)){let n=norm(part);if(n)s.add(n);let bits=n.split(" ");if(bits.length>=2&&bits.at(-1).length>=4)s.add(bits.at(-1))}}return s}
function check(user,canonical,extra){let u=norm(user);if(!u)return false;let set=acceptSet(canonical,extra);if(set.has(u))return true;for(const a of set){let d=levenshtein(u,a);if(a.length>=5&&u.length>=4&&d<=1)return true;if(a.length>=9&&u.length>=8&&d<=2)return true}return false}
function jparse(s){try{return s?JSON.parse(s):{}}catch{return {}}}
function key(kind,id){return kind+":"+id}
function loadState(){
  try{STATE=JSON.parse(localStorage.getItem("trivia_state_v1"))}catch{}
  if(!STATE)STATE={q:{},a:{},attempts:[],seeded:false};
  if(!STATE.seeded){
    for(const r of DATA.learning_state||[]) STATE.q[r.question_id]={...r};
    for(const r of DATA.association_learning_state||[]) STATE.a[r.association_id]={...r};
    STATE.seeded=true; saveState();
  }
}
function saveState(){localStorage.setItem("trivia_state_v1",JSON.stringify(STATE))}
function now(){return Date.now()}
function parseDate(x){let t=Date.parse(x);return Number.isFinite(t)?t:0}
function stats(){
  let bank=DATA.questions.length, unseen=0,due=0;
  for(const q of DATA.questions){let s=STATE.q[q.id];if(!s||!(+s.times_seen))unseen++;if(s&&s.next_review&&parseDate(s.next_review)<=now())due++}
  let imported=DATA.attempts||[]; let local=STATE.attempts||[];
  let all=[...imported,...local]; let cor=all.filter(x=>+x.correct===1).length;
  return {bank,unseen,due,cor,att:all.length,pct:all.length?100*cor/all.length:0}
}
function menu(){
  let s=stats();
  app.innerHTML=`<h1>TRIVIA TRAINER // MOBILE</h1>
  <div class="dim">offline · terminal skin · local progress</div><div class="line"></div>
  <div>Bank: ${s.bank} &nbsp; Unseen: ${s.unseen} &nbsp; Reviews due: ${s.due}</div>
  <div>All-time: ${s.cor}/${s.att} (${s.pct.toFixed(1)}%)</div>
  <div class="menu">
  <button onclick="play('quick')">1. Quick Play</button>
  <button onclick="play('learn')">2. Learn New</button>
  <button onclick="play('review')">3. Review Due</button>
  <button onclick="play('assoc')">6. Association Drill</button>
  <button onclick="showStats()">7. Statistics</button>
  <button onclick="exportProgress()">↓ Export Progress</button>
  </div>
  <div class="section"><h3>Install</h3><div class="dim small">Safari → Share → Add to Home Screen. After first load, it works offline.</div></div>`;
}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function play(mode){
 currentMode=mode;
 if(mode==="assoc"){
   let candidates=DATA.associations.filter(a=>{let s=STATE.a[a.id];return !s||!s.due_at||parseDate(s.due_at)<=now()});
   if(!candidates.length)candidates=DATA.associations;
   let a=pick(candidates), rev=String(a.direction||"forward").toLowerCase()==="reverse";
   current={kind:"a",id:a.id,raw:a,
     q_en:rev?a.right_item:a.left_item,q_es:(rev?a.right_item_es:a.left_item_es)||"",
     answer:rev?a.left_item:a.right_item,answer_es:(rev?a.left_item_es:a.right_item_es)||"",
     accept:(rev?a.left_accept:a.right_accept)||a.accept||"",category:a.category||"",subcategory:a.subcategory||"",difficulty:a.difficulty||5};
 }else{
   let qs=DATA.questions;
   if(mode==="learn")qs=qs.filter(q=>!STATE.q[q.id]||!(+STATE.q[q.id].times_seen));
   if(mode==="review")qs=qs.filter(q=>STATE.q[q.id]&&STATE.q[q.id].next_review&&parseDate(STATE.q[q.id].next_review)<=now());
   if(!qs.length)qs=DATA.questions;
   let q=pick(qs); current={kind:"q",id:q.id,raw:q,q_en:q.question,q_es:q.question_es||"",answer:q.answer,answer_es:q.answer_es||"",accept:q.accept||"",category:q.category||"",subcategory:q.subcategory||"",difficulty:q.difficulty||5};
 }
 renderQuestion();
}
function renderQuestion(){
 let rel=current.kind==="a"?' → ?':'';
 app.innerHTML=`<div class="top"><button onclick="menu()">← MENU</button><span class="dim small">${esc(currentMode.toUpperCase())}</span></div>
 <div class="line"></div><div class="meta">${esc(current.category)}${current.subcategory?' / '+esc(current.subcategory):''} · ${esc(current.difficulty)}/10</div>
 <div class="q">${esc(current.q_en)}${rel}</div>${current.q_es?`<div class="q es">${esc(current.q_es)}${rel}</div>`:""}
 <div class="line"></div><form onsubmit="answer(event)"><input id="ans" autocomplete="off" autocapitalize="words" placeholder="> answer / respuesta"><button class="enter" type="submit">ENTER</button></form>`;
 document.getElementById("ans").focus();
}
function updateLearning(correct,user){
 let t=new Date(), iso=t.toISOString();
 STATE.attempts.push({question_id:current.kind==="q"?current.id:null,association_id:current.kind==="a"?current.id:null,user_answer:user,correct:correct?1:0,mode:"mobile_"+currentMode,created_at:iso});
 if(current.kind==="q"){
   let s=STATE.q[current.id]||{times_seen:0,correct_count:0,incorrect_count:0,streak:0};
   s.times_seen=(+s.times_seen||0)+1;s.last_seen=iso;
   if(correct){s.correct_count=(+s.correct_count||0)+1;s.streak=(+s.streak||0)+1;let d=s.streak===1?1:s.streak===2?3:s.streak===3?7:s.streak===4?14:30;s.next_review=new Date(t.getTime()+d*86400000).toISOString()}
   else{s.incorrect_count=(+s.incorrect_count||0)+1;s.streak=0;s.next_review=new Date(t.getTime()+10*60000).toISOString()}
   STATE.q[current.id]=s;
 }else{
   let s=STATE.a[current.id]||{repetitions:0,correct_count:0,incorrect_count:0};
   s.last_seen=iso;
   if(correct){s.repetitions=(+s.repetitions||0)+1;s.correct_count=(+s.correct_count||0)+1;let d=s.repetitions===1?1:s.repetitions===2?3:s.repetitions===3?7:14;s.due_at=new Date(t.getTime()+d*86400000).toISOString()}
   else{s.incorrect_count=(+s.incorrect_count||0)+1;s.due_at=new Date(t.getTime()+10*60000).toISOString()}
   STATE.a[current.id]=s;
 }
 saveState();
}
function sections(r){
 let out="",m=jparse(r.metadata_json),w=jparse(r.notable_works_json),a=jparse(r.anchors_json);
 if(m&&Object.keys(m).length){let rows=Object.entries(m).filter(x=>x[1]).map(([k,v])=>`<b>${esc(k)}</b><span>${esc(v)}</span>`).join("");if(rows)out+=`<div class="section"><h3>Quick Facts / Ficha</h3><div class="factgrid">${rows}</div></div>`}
 let works=w&&w.en||[];if(works.length)out+=`<div class="section"><h3>Other Notable Works</h3>${esc(works.slice(0,5).join(" · "))}</div>`;
 let en=a&&a.en||[],es=a&&a.es||[];if(en.length||es.length){out+=`<div class="section"><h3>3 Key Anchors / 3 Anclas</h3>`;if(en.length)out+=`<span class="dim small">EN</span><ul>${en.slice(0,3).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;if(es.length)out+=`<span class="dim small">ES</span><ul>${es.slice(0,3).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;out+="</div>"}
 if(r.explanation||r.explanation_es){out+=`<div class="section"><h3>Info</h3>`;if(r.explanation)out+=`<div class="info"><span class="dim small">EN</span><br>${esc(r.explanation)}</div>`;if(r.explanation_es)out+=`<div class="info es"><span class="dim small">ES</span><br>${esc(r.explanation_es)}</div>`;out+="</div>"}
 if(r.wikipedia_url||r.wikipedia_url_es){out+=`<div class="menu">`;if(r.wikipedia_url)out+=`<button onclick="window.open('${esc(r.wikipedia_url)}','_blank')">Wikipedia EN ↗</button>`;if(r.wikipedia_url_es)out+=`<button onclick="window.open('${esc(r.wikipedia_url_es)}','_blank')">Wikipedia ES ↗</button>`;out+="</div>"}
 return out;
}
function answer(ev){
 ev.preventDefault();let user=document.getElementById("ans").value;
 let correct=check(user,current.answer,[current.answer_es,current.accept].filter(Boolean).join("|"));
 updateLearning(correct,user);
 let canon=esc(current.answer)+(current.answer_es&&norm(current.answer_es)!==norm(current.answer)?' / '+esc(current.answer_es):'');
 app.innerHTML=`<div class="top"><button onclick="menu()">← MENU</button><span class="dim small">${esc(currentMode.toUpperCase())}</span></div><div class="line"></div>
 ${correct?'<div class="good">✓ CORRECT</div>':'<div class="bad">✗ INCORRECT</div>'}<div class="answer">${canon}</div>
 <div class="dim small">Your answer: ${esc(user)}</div>${sections(current.raw)}
 <div class="line"></div><button class="enter" onclick="play('${esc(currentMode)}')">NEXT →</button>`;
}
function showStats(){
 let s=stats();app.innerHTML=`<div class="top"><button onclick="menu()">← MENU</button></div><div class="line"></div><h1>STATISTICS</h1>
 <p>Bank: ${s.bank}<br>Unseen: ${s.unseen}<br>Reviews due: ${s.due}<br>All-time: ${s.cor}/${s.att} (${s.pct.toFixed(1)}%)</p>
 <div class="section"><h3>Local device</h3><div>New attempts on this phone: ${STATE.attempts.length}</div></div>`;
}
function exportProgress(){
 let blob=new Blob([JSON.stringify(STATE,null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="trivia_mobile_progress.json";a.click();URL.revokeObjectURL(a.href);
}
async function init(){
 DATA=await fetch("data.json").then(r=>r.json());loadState();menu();
 if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
init().catch(e=>app.innerHTML="<h1>LOAD ERROR</h1><pre>"+esc(e)+"</pre>");
</script>
</body></html>
